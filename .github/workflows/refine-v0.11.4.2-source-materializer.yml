name: Refine v0.11.4.2 Source Materializer

on:
  push:
    branches:
      - fix/v0.11.4.2-source-materializer
    paths:
      - .github/workflows/refine-v0.11.4.2-source-materializer.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact state, apply patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          expected_main='a27e3d2359cffa53d51741b2c77f80205be29df5'
          expected_staging='5e361851720d41d6374b2b270874c71505ff1171'
          branch='fix/v0.11.4.2-source-materializer'
          test "$GITHUB_REF_NAME" = "$branch"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$expected_main"
          test "$(git rev-parse HEAD^)" = "$expected_staging"
          test -f scripts/_refine-v0.11.4.2.py
          python3 scripts/_refine-v0.11.4.2.py
          node scripts/variation-bundle-request-fixture.mjs
          node scripts/variation-bundle-static-fixture.mjs
          git config user.name 'CatalogoTop Automation'
          git config user.email 'catalogotop-automation@users.noreply.github.com'
          git rm scripts/_refine-v0.11.4.2.py .github/workflows/refine-v0.11.4.2-source-materializer.yml
          git add src/variation-bundle.js scripts/variation-bundle-request-fixture.mjs scripts/variation-bundle-static-fixture.mjs docs/image-variants-v0.11.4.md docs/v0.11.4.2-source-materializer.md AGENTS.md
          git commit -m 'fix: support sandbox-aware source materialization'
          git push origin HEAD:"$branch"
