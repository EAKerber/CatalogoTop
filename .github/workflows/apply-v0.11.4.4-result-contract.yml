name: Apply v0.11.4.4 Result Contract

on:
  push:
    branches:
      - fix/v0.11.4.4-result-contract-self-description
    paths:
      - .github/workflows/apply-v0.11.4.4-result-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, patch, validate and self-clean
        shell: bash
        run: |
          set -euo pipefail
          expected_main='ea0a3fafd004dff2c0cae5ed8b096a0219fa2b99'
          expected_parent='6d5fc10c6e633a90ba3c9790975baba2385e68a2'
          branch='fix/v0.11.4.4-result-contract-self-description'
          test "$GITHUB_REF_NAME" = "$branch"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$expected_main"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          python3 scripts/_apply-v0.11.4.4-result-contract.py
          npm test
          git config user.name 'CatalogoTop Automation'
          git config user.email 'catalogotop-automation@users.noreply.github.com'
          git rm -f scripts/_apply-v0.11.4.4-result-contract.py .github/workflows/apply-v0.11.4.4-result-contract.yml
          git add src/variation-bundle.js scripts/variation-bundle-request-fixture.mjs scripts/variation-bundle-static-fixture.mjs docs/v0.11.4.4-result-contract-self-description.md
          git commit -m 'fix: make image result contract self-describing'
          git push origin HEAD:"$branch"
