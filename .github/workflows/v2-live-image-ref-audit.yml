name: Temporary V1 to V2 Bulk Migration Verification

on:
  push:
    branches:
      - feat/v2-r4a-template-contract-binding

permissions:
  contents: read

jobs:
  verify-v1-v2-migration:
    if: contains(github.event.head_commit.message, 'verify V1 to V2 bulk migration')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deploy and scheduled migration
        run: sleep 150
      - name: Verify migrated V2 snapshot and images
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          V1 = 'https://topcatalogos.netlify.app'
          V2 = 'https://catalogotop-v2-test.netlify.app'

          def get_json(url):
              req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'CatalogoTop-v1-v2-migration-check'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)

          deadline = time.time() + 360
          last = None
          while time.time() < deadline:
              v1 = get_json(V1 + '/api/products')
              v2 = get_json(V2 + '/api/products')
              if int(v2.get('schemaVersion') or 0) == 2 and len(v2.get('products') or []) == len(v1.get('products') or []) and len(v2.get('products') or []) > 0:
                  break
              last = {'v1Products': len(v1.get('products') or []), 'v2Products': len(v2.get('products') or []), 'v2Schema': v2.get('schemaVersion'), 'v2Revision': v2.get('revision')}
              print('WAIT_MIGRATION', json.dumps(last), flush=True)
              time.sleep(20)
          else:
              raise SystemExit('migration did not materialize: ' + json.dumps(last))

          v1_products = v1.get('products') or []
          v2_products = v2.get('products') or []
          folders = v2.get('folders') or []
          folder_ids = {str(f.get('id') or '') for f in folders}

          if len(v1_products) != len(v2_products):
              raise SystemExit(f'product count mismatch: v1={len(v1_products)} v2={len(v2_products)}')

          by_id_v2 = {str(p.get('id')): p for p in v2_products}
          mismatches = []
          for source in v1_products:
              target = by_id_v2.get(str(source.get('id')))
              if not target:
                  mismatches.append({'id': source.get('id'), 'reason': 'missing_target'})
                  continue
              source_copy = dict(source)
              target_copy = dict(target)
              target_copy.pop('folderId', None)
              if source_copy != target_copy:
                  mismatches.append({'id': source.get('id'), 'reason': 'payload_changed'})
              if str(target.get('folderId') or '') not in folder_ids:
                  mismatches.append({'id': source.get('id'), 'reason': 'invalid_folder'})

          if mismatches:
              raise SystemExit('snapshot mismatch: ' + json.dumps(mismatches[:20], ensure_ascii=False))

          refs = []
          for product in v2_products:
              values = [product.get('image')]
              values.extend((e or {}).get('image') for e in (product.get('imageGallery') or []))
              values.extend((e or {}).get('image') for e in (product.get('variants') or []) if (e or {}).get('image'))
              for value in values:
                  value = str(value or '').strip()
                  if value:
                      refs.append(value)
          refs = sorted(set(refs))

          def probe(value):
              if re.fullmatch(r'/api/assets/sha256/[a-f0-9]{64}', value, re.I):
                  url = urllib.parse.urljoin(V2, value)
              elif value.startswith('https://'):
                  url = value
              elif value.startswith('data:image/'):
                  return {'value': value[:32] + '...', 'ok': True, 'kind': 'data'}
              else:
                  return {'value': value, 'ok': False, 'error': 'unsupported_ref'}
              try:
                  req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'CatalogoTop-v1-v2-migration-check'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      ctype = response.headers.get('content-type', '').split(';', 1)[0].strip().lower()
                      return {'value': value, 'url': url, 'ok': response.status == 200 and ctype.startswith('image/'), 'status': response.status, 'contentType': ctype}
              except urllib.error.HTTPError as error:
                  return {'value': value, 'url': url, 'ok': False, 'status': error.code}
              except Exception as error:
                  return {'value': value, 'url': url, 'ok': False, 'error': str(error)}

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              probes = list(pool.map(probe, refs))
          bad = [p for p in probes if not p.get('ok')]
          if bad:
              raise SystemExit('image refs unavailable: ' + json.dumps(bad, ensure_ascii=False))

          picsum = [ref for ref in refs if 'picsum.photos' in ref]
          if picsum:
              raise SystemExit('test placeholders survived migration: ' + json.dumps(picsum))

          print('PASS V1_TO_V2_BULK_MIGRATION', json.dumps({
              'v1Revision': v1.get('revision'),
              'v1Products': len(v1_products),
              'v2Revision': v2.get('revision'),
              'v2Products': len(v2_products),
              'v2Folders': len(folders),
              'imageRefs': len(refs),
              'allImagesAvailable': True,
              'picsumRefs': 0
          }, ensure_ascii=False))
          PY
