name: Apply V2 R1b Integration

on:
  push:
    branches:
      - feat/v2-r1b-product-snapshot
    paths:
      - scripts/_apply-v2-r1b-integration.py
      - .github/workflows/apply-v2-r1b-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard V2 base
        shell: bash
        run: |
          set -euo pipefail
          expected="c596bcf0bf2a945fac618d00dea9dfd11a563b1b"
          actual="$(git ls-remote origin refs/heads/v2 | cut -f1)"
          test "$actual" = "$expected"
      - name: Apply deterministic patch
        run: python scripts/_apply-v2-r1b-integration.py
      - name: Validate integration
        run: npm test
      - name: Commit functional tree and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CatalogoTop Ops"
          git config user.email "actions@users.noreply.github.com"
          git rm -f scripts/_apply-v2-r1b-integration.py .github/workflows/apply-v2-r1b-integration.yml
          git add src/core.js src/app.js index.html package.json scripts/storage-contract-fixture.mjs
          git commit -m "V2-R1b — integrate ProductSnapshot v2 runtime"
          git push origin HEAD:feat/v2-r1b-product-snapshot
