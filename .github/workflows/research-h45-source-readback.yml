name: Research Elongated Source Readback

on:
  push:
    branches:
      - research/source-readback-h45
  pull_request:
    branches:
      - research/semantic-image-variation-v2
    paths:
      - '.github/workflows/research-h45-source-readback.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize public benchmark sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-artifact
          curl --fail --location --silent --show-error -A 'Mozilla/5.0 CatalogoTop-Research/1.0' \
            --connect-timeout 15 --max-time 45 \
            --output research-artifact/h45-source.bin \
            'https://cdn.awsli.com.br/600x450/2716/2716952/produto/258186768/crre-2-he2q0be6kv.jpg'
          curl --fail --location --silent --show-error -A 'Mozilla/5.0 CatalogoTop-Research/1.0' \
            --connect-timeout 15 --max-time 45 \
            --output research-artifact/soft-extra-source.bin \
            'https://trentoferramentas.cdn.magazord.com.br/img/2024/11/produto/1035/corredica-14-soft-closing.png?ims=fit-in%2F1210x'
          curl --fail --location --silent --show-error -A 'Mozilla/5.0 CatalogoTop-Research/1.0' \
            --connect-timeout 15 --max-time 45 \
            --output research-artifact/soft-close-source.bin \
            'https://gmad.fbitsstatic.net/img/p/corredica-telescopica-com-amortecedor-300mm-renna-152536/343303-2.jpg?h=420&v=202604291612&w=420'
          test -s research-artifact/h45-source.bin
          test -s research-artifact/soft-extra-source.bin
          test -s research-artifact/soft-close-source.bin

      - name: Record passive byte evidence
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, struct

          SOURCES = {
              'h45': {
                  'file': 'h45-source.bin',
                  'url': 'https://cdn.awsli.com.br/600x450/2716/2716952/produto/258186768/crre-2-he2q0be6kv.jpg'
              },
              'soft-extra': {
                  'file': 'soft-extra-source.bin',
                  'url': 'https://trentoferramentas.cdn.magazord.com.br/img/2024/11/produto/1035/corredica-14-soft-closing.png?ims=fit-in%2F1210x'
              },
              'soft-close': {
                  'file': 'soft-close-source.bin',
                  'url': 'https://gmad.fbitsstatic.net/img/p/corredica-telescopica-com-amortecedor-300mm-renna-152536/343303-2.jpg?h=420&v=202604291612&w=420'
              }
          }

          def jpeg_size(blob):
              i = 2
              while i + 9 < len(blob):
                  if blob[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(blob) and blob[i] == 0xFF:
                      i += 1
                  marker = blob[i]
                  i += 1
                  if marker in (0xD8, 0xD9):
                      continue
                  if i + 2 > len(blob):
                      break
                  seglen = struct.unpack('>H', blob[i:i+2])[0]
                  if marker in {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}:
                      if i + 7 > len(blob):
                          break
                      return struct.unpack('>H', blob[i+5:i+7])[0], struct.unpack('>H', blob[i+3:i+5])[0]
                  i += seglen
              raise ValueError('JPEG dimensions not found')

          def sniff(blob):
              if blob.startswith(b'\x89PNG\r\n\x1a\n'):
                  if len(blob) < 24:
                      raise ValueError('truncated PNG')
                  return 'image/png', struct.unpack('>I', blob[16:20])[0], struct.unpack('>I', blob[20:24])[0]
              if blob.startswith(b'\xff\xd8\xff'):
                  width, height = jpeg_size(blob)
                  return 'image/jpeg', width, height
              if len(blob) >= 30 and blob[:4] == b'RIFF' and blob[8:12] == b'WEBP':
                  return 'image/webp', None, None
              raise ValueError('unsupported image magic')

          records = []
          for source_id, spec in SOURCES.items():
              path = Path('research-artifact') / spec['file']
              data = path.read_bytes()
              mime, width, height = sniff(data)
              record = {
                  'sourceId': source_id,
                  'sourceUrl': spec['url'],
                  'mimeType': mime,
                  'byteLength': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'widthPx': width,
                  'heightPx': height,
                  'transport': 'github-actions-public-https'
              }
              records.append(record)
              print(json.dumps(record, indent=2))

          evidence = {
              'kind': 'catalogotop.research-source-readback-set',
              'version': 1,
              'sources': records
          }
          Path('research-artifact/sources.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')

      - name: Upload source readback artifact
        uses: actions/upload-artifact@v4
        with:
          name: elongated-source-readback
          path: research-artifact/
          if-no-files-found: error
          retention-days: 7
