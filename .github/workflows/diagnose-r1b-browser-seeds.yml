name: Apply R1b Merge Guard

on:
  push:
    branches:
      - feat/v2-r1b-product-snapshot
    paths:
      - .github/workflows/diagnose-r1b-browser-seeds.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard V2 base
        shell: bash
        run: |
          set -euo pipefail
          expected="c596bcf0bf2a945fac618d00dea9dfd11a563b1b"
          actual="$(git ls-remote origin refs/heads/v2 | cut -f1)"
          test "$actual" = "$expected"
      - name: Patch merge organization semantics and fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path('src/core.js')
          text = core.read_text(encoding='utf-8')
          old = r'''  function mergeProducts(incoming, mode = 'merge') {
            const source = Array.isArray(incoming) ? incoming : [];
            const explicitQuantityByCode = new Set(source
              .filter(product => product && Object.prototype.hasOwnProperty.call(product, 'quantityPrice'))
              .map(product => String(product.code || '').trim().toLowerCase())
              .filter(Boolean));
            const explicitGalleryByCode = new Set(source
              .filter(product => product && Object.prototype.hasOwnProperty.call(product, 'imageGallery'))
              .map(product => String(product.code || '').trim().toLowerCase())
              .filter(Boolean));
            const normalized = source.map(normalizeProduct).filter(p => p.code && p.description);
            return mutate(draft => {
              const prepared = normalized.map(product => assignProductToLegacyPath(draft, product));
              if (mode === 'replace') {
                draft.products = prepared;
                draft.selectedIds = [];
                draft.catalog.presentation.order = [];
                draft.catalog.presentation.itemStyles = {};
                draft.catalog.presentation.blocks = [];
                draft.catalog.presentation.imageSelections = {};
                draft.catalog.presentation.imageVariants = {};
                return;
              }
              const byCode = new Map(draft.products.map((p, index) => [p.code.trim().toLowerCase(), index]));
              prepared.forEach(product => {
                const key = product.code.toLowerCase();
                const existingIndex = byCode.get(key);
                if (existingIndex === undefined) {
                  byCode.set(key, draft.products.length);
                  draft.products.push(product);
                } else {
                  const existing = draft.products[existingIndex];
                  draft.products[existingIndex] = {
                    ...existing,
                    ...product,
                    id: existing.id,
                    image: product.image || existing.image,
                    imageGallery: explicitGalleryByCode.has(key) ? product.imageGallery : existing.imageGallery,
                    quantityPrice: explicitQuantityByCode.has(key) ? product.quantityPrice : existing.quantityPrice,
                    variants: product.variants.length ? product.variants : existing.variants,
                    tableRows: product.tableRows.length ? product.tableRows : existing.tableRows,
                    updatedAt: new Date().toISOString()
                  };
                }
              });
            });
          }
'''
          new = r'''  function prepareMergedProductOrganization(draft, rawProduct, normalized, existing = null) {
            const source = rawProduct && typeof rawProduct === 'object' ? rawProduct : {};
            const hasFolderId = Object.prototype.hasOwnProperty.call(source, 'folderId');
            const hasCategory = Object.prototype.hasOwnProperty.call(source, 'category');
            const hasSubcategory = Object.prototype.hasOwnProperty.call(source, 'subcategory');

            if (hasFolderId) {
              const folderId = String(source.folderId || '').trim();
              if (!folderId) {
                const error = new Error('Produto precisa apontar para uma pasta válida.');
                error.code = 'product_folder_required';
                throw error;
              }
              if (!NS.ProductFolderMigration) return normalizeProduct({ ...normalized, folderId });
              const projection = NS.ProductFolderMigration.projectLegacyForFolder(draft.folders || [], folderId);
              return normalizeProduct({ ...normalized, folderId, ...projection });
            }

            if (!existing) return assignProductToLegacyPath(draft, normalized);
            if (!hasCategory && !hasSubcategory) {
              return normalizeProduct({
                ...normalized,
                folderId: existing.folderId,
                category: existing.category,
                subcategory: existing.subcategory
              });
            }

            return assignProductToLegacyPath(draft, {
              ...normalized,
              folderId: existing.folderId,
              category: hasCategory ? normalized.category : existing.category,
              subcategory: hasSubcategory ? normalized.subcategory : existing.subcategory
            });
          }

          function mergeProducts(incoming, mode = 'merge') {
            const source = Array.isArray(incoming) ? incoming : [];
            const explicitQuantityByCode = new Set(source
              .filter(product => product && Object.prototype.hasOwnProperty.call(product, 'quantityPrice'))
              .map(product => String(product.code || '').trim().toLowerCase())
              .filter(Boolean));
            const explicitGalleryByCode = new Set(source
              .filter(product => product && Object.prototype.hasOwnProperty.call(product, 'imageGallery'))
              .map(product => String(product.code || '').trim().toLowerCase())
              .filter(Boolean));
            const entries = source
              .map(raw => ({ raw, product: normalizeProduct(raw || {}) }))
              .filter(entry => entry.product.code && entry.product.description);
            return mutate(draft => {
              if (mode === 'replace') {
                draft.products = entries.map(entry => prepareMergedProductOrganization(draft, entry.raw, entry.product));
                draft.selectedIds = [];
                draft.catalog.presentation.order = [];
                draft.catalog.presentation.itemStyles = {};
                draft.catalog.presentation.blocks = [];
                draft.catalog.presentation.imageSelections = {};
                draft.catalog.presentation.imageVariants = {};
                return;
              }
              const byCode = new Map(draft.products.map((p, index) => [p.code.trim().toLowerCase(), index]));
              entries.forEach(entry => {
                const key = entry.product.code.toLowerCase();
                const existingIndex = byCode.get(key);
                if (existingIndex === undefined) {
                  const product = prepareMergedProductOrganization(draft, entry.raw, entry.product);
                  byCode.set(key, draft.products.length);
                  draft.products.push(product);
                } else {
                  const existing = draft.products[existingIndex];
                  const product = prepareMergedProductOrganization(draft, entry.raw, entry.product, existing);
                  draft.products[existingIndex] = {
                    ...existing,
                    ...product,
                    id: existing.id,
                    image: product.image || existing.image,
                    imageGallery: explicitGalleryByCode.has(key) ? product.imageGallery : existing.imageGallery,
                    quantityPrice: explicitQuantityByCode.has(key) ? product.quantityPrice : existing.quantityPrice,
                    variants: product.variants.length ? product.variants : existing.variants,
                    tableRows: product.tableRows.length ? product.tableRows : existing.tableRows,
                    updatedAt: new Date().toISOString()
                  };
                }
              });
            });
          }
'''
          if text.count(old) != 1:
              raise SystemExit(f'core merge anchor mismatch: {text.count(old)}')
          core.write_text(text.replace(old, new), encoding='utf-8')

          fixture = Path('scripts/core-folder-state-fixture.mjs')
          text = fixture.read_text(encoding='utf-8')
          anchor = "const preservedEmpty = { id: 'folder-empty', parentId: null, name: 'Planejada' };\n"
          addition = r'''// Merge parcial não pode achatar uma hierarquia profunda só porque a UI/import legado
// representa o restante do caminho em `subcategory` com " / ".
const deepFolders = [
  { id: 'deep-root', parentId: null, name: 'Ferragens' },
  { id: 'deep-mid', parentId: 'deep-root', name: 'Corrediças' },
  { id: 'deep-leaf', parentId: 'deep-mid', name: 'Telescópicas' }
];
Core.setState({
  ...Core.createInitialState(),
  schemaVersion: 8,
  folders: deepFolders,
  products: [{
    id: 'deep-product', code: 'DEEP', description: 'Profundo', folderId: 'deep-leaf',
    category: 'Ferragens', subcategory: 'Corrediças / Telescópicas', status: 'Ativo'
  }]
}, { persist: false });
Core.mergeProducts([{ code: 'DEEP', description: 'Profundo atualizado', price: '25' }]);
let deepState = Core.getState();
assert.equal(deepState.products[0].folderId, 'deep-leaf', 'merge sem organização deve preservar folderId profundo');
assert.equal(deepState.folders.some(folder => folder.name === 'Corrediças / Telescópicas'), false, 'merge sem organização não pode criar pasta achatada');

Core.mergeProducts([{
  code: 'DEEP', description: 'Profundo atualizado 2',
  category: 'Ferragens', subcategory: 'Corrediças / Telescópicas'
}]);
deepState = Core.getState();
assert.equal(deepState.products[0].folderId, 'deep-leaf', 'mirrors legados idênticos devem preservar folderId profundo');
assert.equal(deepState.folders.some(folder => folder.name === 'Corrediças / Telescópicas'), false, 'mirrors idênticos não podem achatar a árvore');

Core.mergeProducts([{
  code: 'DEEP', description: 'Movido explicitamente',
  category: 'Ferragens', subcategory: 'Invisíveis'
}]);
deepState = Core.getState();
assert.notEqual(deepState.products[0].folderId, 'deep-leaf', 'mudança organizacional explícita deve poder mover o produto');
assert.deepEqual(Array.from(FolderTree.pathOf(deepState.folders, deepState.products[0].folderId), item => item.name), ['Ferragens', 'Invisíveis']);

'''
          if text.count(anchor) != 1:
              raise SystemExit(f'fixture anchor mismatch: {text.count(anchor)}')
          fixture.write_text(text.replace(anchor, addition + anchor), encoding='utf-8')
          PY
      - name: Validate merge guard
        run: |
          node --check src/core.js
          node scripts/core-folder-state-fixture.mjs
          npm test
      - name: Commit functional patch and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CatalogoTop Ops"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/diagnose-r1b-browser-seeds.yml .github/workflows/apply-r1b-merge-guard.yml
          git add src/core.js scripts/core-folder-state-fixture.mjs
          git commit -m "fix: preserve deep folders across legacy product merge"
          git push origin HEAD:feat/v2-r1b-product-snapshot
