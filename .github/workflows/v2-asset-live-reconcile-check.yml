name: Temporary V2 Asset Live Reconcile Check

on:
  push:
    branches:
      - feat/v2-r4a-template-contract-binding

permissions:
  contents: read

jobs:
  verify-live-v2-assets:
    if: contains(github.event.head_commit.message, 'temporary live V2 asset verification')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deploy and scheduled reconcile
        run: sleep 150
      - name: Verify authoritative V2 asset inventory is physically available
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          BASE = 'https://catalogotop-v2-test.netlify.app'
          deadline = time.time() + 360
          last = None

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(f'{BASE}/api/asset-inventory?ts={int(time.time())}', timeout=30) as response:
                      payload = json.load(response)
                  assets = payload.get('assets') or []
                  unavailable = [a for a in assets if not a.get('available')]
                  bad = []
                  for asset in assets:
                      url = BASE + str(asset.get('url') or '')
                      try:
                          req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                          with urllib.request.urlopen(req, timeout=30) as image_response:
                              content_type = image_response.headers.get('content-type', '').split(';', 1)[0].strip().lower()
                              if image_response.status != 200 or not content_type.startswith('image/'):
                                  bad.append({'id': asset.get('id'), 'status': image_response.status, 'contentType': content_type})
                      except Exception as error:
                          bad.append({'id': asset.get('id'), 'error': str(error)})

                  last = {
                      'assets': len(assets),
                      'unavailable': [a.get('id') for a in unavailable],
                      'bad': bad,
                      'productRevision': payload.get('productRevision'),
                      'catalogRevision': payload.get('catalogRevision'),
                      'assetIndexRevision': payload.get('assetIndexRevision'),
                  }
                  print('LIVE_V2_ASSET_CHECK', json.dumps(last, ensure_ascii=False), flush=True)
                  if assets and not unavailable and not bad:
                      print(f'PASS live V2 asset reconciliation: {len(assets)} authoritative assets physically available', flush=True)
                      raise SystemExit(0)
              except urllib.error.HTTPError as error:
                  last = {'httpError': error.code, 'detail': error.read().decode('utf-8', 'replace')[:500]}
                  print('LIVE_V2_ASSET_CHECK', json.dumps(last, ensure_ascii=False), flush=True)
              except Exception as error:
                  last = {'error': str(error)}
                  print('LIVE_V2_ASSET_CHECK', json.dumps(last, ensure_ascii=False), flush=True)
              time.sleep(20)

          raise SystemExit('V2 asset reconciliation did not converge: ' + json.dumps(last, ensure_ascii=False))
          PY
