name: Apply v0.11.4.1 Hotfix Patch

on:
  push:
    branches:
      - fix/v0.11.4.1-variation-export-mobile-history

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.11.4.1-variation-export-mobile-history
          fetch-depth: 0
      - name: Verify stable main baseline and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/v0.11.4.1-variation-export-mobile-history'
          expected='acf18f4a4d67313d82d46389089f3e4bdae22a84'
          actual="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$actual" = "$expected" || { echo "main moved: $actual" >&2; exit 1; }
      - name: Apply deterministic patch
        run: python3 scripts/apply-v0.11.4.1-hotfix.py
      - name: Commit hotfix and remove patch runner
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-v0.11.4.1-hotfix.py .github/workflows/apply-v0.11.4.1-hotfix.yml
          git add src/variation-bundle.js src/variation-bundle-controls.js src/mobile-workspace.js scripts/variation-bundle-request-fixture.mjs scripts/browser-variation-bundle-gate.mjs scripts/browser-editor-shortcuts-history-gate.mjs scripts/apply-v0.11.4.1-hotfix.py .github/workflows/apply-v0.11.4.1-hotfix.yml
          git diff --cached --check
          git config user.name 'CatalogoTop Hotfix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: export remote image sources and isolate mobile history'
          git push origin HEAD:fix/v0.11.4.1-variation-export-mobile-history
