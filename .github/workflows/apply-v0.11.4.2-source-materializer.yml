name: Apply v0.11.4.2 Source Materializer

on:
  push:
    branches:
      - fix/v0.11.4.2-source-materializer
    paths:
      - .github/workflows/apply-v0.11.4.2-source-materializer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify base and apply deterministic patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_main='a27e3d2359cffa53d51741b2c77f80205be29df5'
          branch='fix/v0.11.4.2-source-materializer'
          test "$GITHUB_REF_NAME" = "$branch"
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$main_sha" = "$expected_main" || { echo "main moved: $main_sha" >&2; exit 1; }
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one patch target, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          helper_function = r'''  function sourceMaterializerScript() {
            return String.raw`#!/usr/bin/env python3
          from __future__ import annotations

          import hashlib
          import ipaddress
          import json
          import socket
          import sys
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urljoin, urlparse
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          REQUEST_KIND = "catalogotop.image-variation-request"
          REQUEST_VERSION = 2
          INDEX_KIND = "catalogotop.materialized-sources"
          INDEX_VERSION = 1
          MAX_SOURCE_BYTES = 25 * 1024 * 1024
          MAX_TOTAL_BYTES = 200 * 1024 * 1024
          MAX_REDIRECTS = 5
          TIMEOUT_SECONDS = 20
          CHUNK_BYTES = 64 * 1024


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def fail(message: str) -> None:
              raise RuntimeError(message)


          def validate_public_url(value: str) -> str:
              try:
                  parsed = urlparse(value)
                  port = parsed.port
              except ValueError as exc:
                  fail(f"invalid-url:{exc}")
              if parsed.scheme not in {"http", "https"} or not parsed.hostname:
                  fail("url-must-be-http-or-https")
              if parsed.username or parsed.password:
                  fail("url-credentials-not-allowed")
              if port not in {None, 80, 443}:
                  fail(f"url-port-not-allowed:{port}")
              host = parsed.hostname.rstrip(".").lower()
              if host == "localhost" or host.endswith(".local"):
                  fail("local-hostname-not-allowed")
              resolved_port = port or (443 if parsed.scheme == "https" else 80)
              try:
                  addresses = {
                      info[4][0].split("%", 1)[0]
                      for info in socket.getaddrinfo(host, resolved_port, type=socket.SOCK_STREAM)
                  }
              except OSError as exc:
                  fail(f"dns-resolution-failed:{exc}")
              if not addresses:
                  fail("dns-resolution-empty")
              for address in addresses:
                  try:
                      ip = ipaddress.ip_address(address)
                  except ValueError:
                      fail(f"dns-address-invalid:{address}")
                  if not ip.is_global:
                      fail(f"non-public-address-blocked:{address}")
              return value


          def fetch_source(url: str) -> tuple[bytes, str, str]:
              opener = build_opener(NoRedirect())
              current = url
              for redirect_count in range(MAX_REDIRECTS + 1):
                  validate_public_url(current)
                  request = Request(
                      current,
                      headers={
                          "User-Agent": "CatalogoTop-Source-Materializer/1.0",
                          "Accept": "image/png,image/jpeg,image/webp,image/gif,image/avif,image/svg+xml;q=0.9,*/*;q=0.1",
                      },
                  )
                  try:
                      response = opener.open(request, timeout=TIMEOUT_SECONDS)
                  except HTTPError as exc:
                      if exc.code in {301, 302, 303, 307, 308}:
                          location = exc.headers.get("Location")
                          if not location:
                              fail(f"redirect-without-location:{exc.code}")
                          if redirect_count >= MAX_REDIRECTS:
                              fail("redirect-limit-exceeded")
                          current = urljoin(current, location)
                          continue
                      fail(f"http-error:{exc.code}")

                  with response:
                      final_url = response.geturl()
                      validate_public_url(final_url)
                      declared = str(response.headers.get("Content-Type") or "").split(";", 1)[0].strip().lower()
                      length = response.headers.get("Content-Length")
                      if length:
                          try:
                              if int(length) > MAX_SOURCE_BYTES:
                                  fail(f"source-size-limit:{length}")
                          except ValueError:
                              pass
                      chunks = []
                      total = 0
                      while True:
                          chunk = response.read(CHUNK_BYTES)
                          if not chunk:
                              break
                          total += len(chunk)
                          if total > MAX_SOURCE_BYTES:
                              fail(f"source-size-limit:{total}")
                          chunks.append(chunk)
                      if not total:
                          fail("source-empty")
                      return b"".join(chunks), final_url, declared
              fail("redirect-limit-exceeded")


          def sniff_image(data: bytes, declared: str) -> tuple[str, str]:
              if data.startswith(b"\x89PNG\r\n\x1a\n"):
                  return "image/png", "png"
              if data.startswith(b"\xff\xd8\xff"):
                  return "image/jpeg", "jpg"
              if len(data) >= 12 and data[:4] == b"RIFF" and data[8:12] == b"WEBP":
                  return "image/webp", "webp"
              if data.startswith((b"GIF87a", b"GIF89a")):
                  return "image/gif", "gif"
              if len(data) >= 12 and data[4:8] == b"ftyp" and data[8:12] in {b"avif", b"avis"}:
                  return "image/avif", "avif"
              head = data[:4096].lstrip(b"\xef\xbb\xbf \t\r\n")
              if declared == "image/svg+xml" and b"<svg" in head.lower():
                  return "image/svg+xml", "svg"
              fail(f"unsupported-or-unrecognized-image:{declared or 'unknown'}")


          def source_fingerprint(url: str) -> str:
              return hashlib.sha256(f"remote-url:{url}".encode("utf-8")).hexdigest()


          def load_manifest(root: Path) -> dict:
              path = root / "manifest.json"
              if not path.is_file():
                  fail("manifest.json-not-found")
              manifest = json.loads(path.read_text(encoding="utf-8"))
              if manifest.get("kind") != REQUEST_KIND or int(manifest.get("version") or 0) != REQUEST_VERSION:
                  fail("unsupported-request-kind-or-version")
              request_id = str(manifest.get("requestId") or "").lower()
              if len(request_id) != 64 or any(ch not in "0123456789abcdef" for ch in request_id):
                  fail("requestId-invalid")
              if not isinstance(manifest.get("jobs"), list):
                  fail("jobs-invalid")
              return manifest


          def remote_sources(manifest: dict) -> list[dict]:
              by_fingerprint: dict[str, dict] = {}
              for job in manifest["jobs"]:
                  source = job.get("source") if isinstance(job, dict) else None
                  if not isinstance(source, dict) or source.get("mode") != "remote-url":
                      continue
                  url = str(source.get("url") or "").strip()
                  fingerprint = str(source.get("fingerprint") or "").strip().lower()
                  expected = source_fingerprint(url)
                  if fingerprint != expected:
                      fail(f"source-fingerprint-mismatch:{job.get('jobId', '')}")
                  current = by_fingerprint.get(fingerprint)
                  if current and current["url"] != url:
                      fail(f"source-fingerprint-collision:{fingerprint}")
                  if not current:
                      current = {"fingerprint": fingerprint, "url": url, "jobIds": []}
                      by_fingerprint[fingerprint] = current
                  job_id = str(job.get("jobId") or "")
                  if job_id and job_id not in current["jobIds"]:
                      current["jobIds"].append(job_id)
              return [by_fingerprint[key] for key in sorted(by_fingerprint)]


          def main() -> int:
              root = Path(sys.argv[1] if len(sys.argv) > 1 else ".").expanduser().resolve()
              manifest = load_manifest(root)
              output_dir = root / "sources" / "materialized"
              context_dir = root / "context"
              output_dir.mkdir(parents=True, exist_ok=True)
              context_dir.mkdir(parents=True, exist_ok=True)

              materialized = []
              failures = []
              total_bytes = 0
              for source in remote_sources(manifest):
                  try:
                      data, final_url, declared = fetch_source(source["url"])
                      mime_type, extension = sniff_image(data, declared)
                      total_bytes += len(data)
                      if total_bytes > MAX_TOTAL_BYTES:
                          fail(f"total-size-limit:{total_bytes}")
                      digest = hashlib.sha256(data).hexdigest()
                      relative_path = Path("sources") / "materialized" / f"{source['fingerprint']}.{extension}"
                      destination = root / relative_path
                      destination.write_bytes(data)
                      materialized.append({
                          "fingerprint": source["fingerprint"],
                          "url": source["url"],
                          "finalUrl": final_url,
                          "path": relative_path.as_posix(),
                          "mimeType": mime_type,
                          "sha256": digest,
                          "byteLength": len(data),
                          "jobIds": sorted(source["jobIds"]),
                      })
                  except Exception as exc:
                      failures.append({
                          "fingerprint": source["fingerprint"],
                          "url": source["url"],
                          "jobIds": sorted(source["jobIds"]),
                          "error": str(exc),
                      })

              index = {
                  "kind": INDEX_KIND,
                  "version": INDEX_VERSION,
                  "requestId": manifest["requestId"],
                  "manifestAuthority": "manifest.json",
                  "sources": materialized,
                  "failures": failures,
              }
              index_path = context_dir / "materialized-sources.json"
              index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(f"Materialized {len(materialized)} remote source(s); failures={len(failures)}")
              print(f"Index: {index_path}")
              return 2 if failures else 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except Exception as exc:
                  print(f"ERROR: {exc}", file=sys.stderr)
                  raise SystemExit(2)
          `;
          }

          '''

          bundle_path = Path('src/variation-bundle.js')
          bundle = bundle_path.read_text(encoding='utf-8')
          marker = '  function requestReadme() {\n'
          if bundle.count(marker) != 1 or 'function sourceMaterializerScript()' in bundle:
              raise SystemExit('variation-bundle.js: helper insertion guard failed')
          bundle = bundle.replace(marker, helper_function + marker, 1)
          old_remote = "      'For source.mode=remote-url, source.url is the canonical external locator because browser CORS prevented embedding; retrieve it subject to your own network/security policy.',\n      'Generate only faithful derivatives that preserve the product identity and geometry.',"
          new_remote = "      'For source.mode=remote-url, source.url is the canonical external locator because browser CORS prevented embedding.',\n      'If any job uses source.mode=remote-url, first materialize its bytes locally with: python3 tools/materialize-sources.py .',\n      'The helper writes sources/materialized/... plus context/materialized-sources.json; this index is evidence only and never replaces manifest.json or changes requestId.',\n      'A browser/web preview is not a source asset. Use the embedded or materialized local file as the pixel source; never recreate the product from a visual approximation.',\n      'Prefer file-native deterministic image tooling for faithful transforms it can perform. Use generative editing only when the editor can ingest the actual source pixels.',\n      'If the environment cannot materialize bytes or cannot apply a required edit to local pixels, report that job as capability-blocked rather than approximating it.',\n      'Generate only faithful derivatives that preserve the product identity and geometry.',"
          if bundle.count(old_remote) != 1:
              raise SystemExit('variation-bundle.js: README patch target failed')
          bundle = bundle.replace(old_remote, new_remote, 1)
          old_entries = "      { path: 'context/layout.json', data: `${JSON.stringify(layoutContext(documentModel), null, 2)}\\n` },\n      { path: 'README.txt', data: `${requestReadme()}\\n` }\n    ];"
          new_entries = "      { path: 'context/layout.json', data: `${JSON.stringify(layoutContext(documentModel), null, 2)}\\n` },\n      { path: 'README.txt', data: `${requestReadme()}\\n` },\n      { path: 'tools/materialize-sources.py', data: `${sourceMaterializerScript()}\\n` }\n    ];"
          if bundle.count(old_entries) != 1:
              raise SystemExit('variation-bundle.js: ZIP entries patch target failed')
          bundle = bundle.replace(old_entries, new_entries, 1)
          old_export = "  NS.VariationBundle = Object.freeze({\n    REQUEST_KIND,\n    REQUEST_VERSION,\n    SOURCE_TIMEOUT_MS,\n    ALLOWED_TRANSFORMS,\n    FORBIDDEN_TRANSFORMS,"
          new_export = old_export + "\n    sourceMaterializerScript,"
          if bundle.count(old_export) != 1:
              raise SystemExit('variation-bundle.js: export patch target failed')
          bundle = bundle.replace(old_export, new_export, 1)
          bundle_path.write_text(bundle, encoding='utf-8')

          replace_once(
              'scripts/variation-bundle-request-fixture.mjs',
              "import { readFile } from 'node:fs/promises';\nimport { webcrypto } from 'node:crypto';\nimport vm from 'node:vm';",
              "import { mkdtemp, readFile, rm, writeFile } from 'node:fs/promises';\nimport { webcrypto } from 'node:crypto';\nimport { spawnSync } from 'node:child_process';\nimport { tmpdir } from 'node:os';\nimport { join } from 'node:path';\nimport vm from 'node:vm';"
          )
          replace_once(
              'scripts/variation-bundle-request-fixture.mjs',
              "const { VariationBundle } = NS;\nconst fail = message => { throw new Error(message); };",
              "const { VariationBundle } = NS;\nconst fail = message => { throw new Error(message); };\nconst helperSource = VariationBundle.sourceMaterializerScript();\nif (!helperSource.includes('catalogotop.materialized-sources') || !helperSource.includes('non-public-address-blocked') || !helperSource.includes('source-fingerprint-mismatch')) fail('helper de materialização não preserva índice/guards esperados');\nconst helperTemp = await mkdtemp(join(tmpdir(), 'catalogotop-materializer-'));\ntry {\n  const helperPath = join(helperTemp, 'materialize-sources.py');\n  await writeFile(helperPath, helperSource, 'utf8');\n  const probe = spawnSync('python3', ['--version'], { encoding: 'utf8' });\n  if (probe.status === 0) {\n    const compiled = spawnSync('python3', ['-m', 'py_compile', helperPath], { encoding: 'utf8' });\n    if (compiled.status !== 0) fail(`helper Python inválido: ${compiled.stderr || compiled.stdout}`);\n  }\n} finally {\n  await rm(helperTemp, { recursive: true, force: true });\n}"
          )
          replace_once(
              'scripts/variation-bundle-request-fixture.mjs',
              "if (!first.archive.entries.some(item => item.path === 'manifest.json') || !first.archive.entries.some(item => item.path === 'context/layout.json')) fail('ZIP precisa conter manifest e layout context');",
              "if (!first.archive.entries.some(item => item.path === 'manifest.json') || !first.archive.entries.some(item => item.path === 'context/layout.json')) fail('ZIP precisa conter manifest e layout context');\nif (!first.archive.entries.some(item => item.path === 'tools/materialize-sources.py')) fail('ZIP precisa carregar paved path de materialização para consumidores externos');"
          )

          replace_once(
              'scripts/variation-bundle-static-fixture.mjs',
              "  ['placement keys não dependem do DOM', bundle.includes('function cardPlacementKey') && bundle.includes('function collectionPlacementKey') && bundle.includes('placementsForDocument(documentModel)')],",
              "  ['placement keys não dependem do DOM', bundle.includes('function cardPlacementKey') && bundle.includes('function collectionPlacementKey') && bundle.includes('placementsForDocument(documentModel)')],\n  ['remote-url inclui paved path local e proíbe aproximação a partir de preview', bundle.includes('tools/materialize-sources.py') && bundle.includes('python3 tools/materialize-sources.py .') && bundle.includes('A browser/web preview is not a source asset') && bundle.includes('catalogotop.materialized-sources')],"
          )

          replace_once(
              'docs/image-variants-v0.11.4.md',
              "- `README.txt` — política resumida;\n- `sources/...` — originais canônicos deduplicados por SHA-256.",
              "- `README.txt` — política resumida e paved path do consumidor;\n- `tools/materialize-sources.py` — helper sem dependências de terceiros para materializar `remote-url` em arquivos locais;\n- `sources/...` — originais canônicos deduplicados por SHA-256 quando o navegador consegue ler os bytes.\n\nQuando CORS impede embedding, `source.mode=remote-url` continua apontando para a fonte canônica. O consumidor deve materializar esses bytes antes de editar; uma visualização obtida pela web não é substituto para o pixel source. O helper gera `context/materialized-sources.json` como índice não autoritativo, preservando `manifest.json`, `requestId`, `jobId` e `usageSignature`."
          )

          replace_once(
              'AGENTS.md',
              "- `usageSignature` deve cobrir o contexto material do job: produto, placement, uso, target e hash da fonte. `requestId` não deve depender de metadados informativos/voláteis como `catalog.createdAt`; mudanças materiais de target/source/contexto continuam invalidando o pedido.\n",
              "- `usageSignature` deve cobrir o contexto material do job: produto, placement, uso, target e hash da fonte. `requestId` não deve depender de metadados informativos/voláteis como `catalog.createdAt`; mudanças materiais de target/source/contexto continuam invalidando o pedido.\n- `source.mode=remote-url` é apenas um locator canônico quando CORS impede embedding. O Request Bundle deve carregar um paved path de materialização local dos bytes; preview/web lookup não substitui pixel source, e consumidor sem capacidade de ingerir pixels reais deve falhar explicitamente em vez de aproximar a identidade do produto.\n"
          )

          Path('docs/v0.11.4.2-source-materializer.md').write_text('''# v0.11.4.2 — Remote Source Materializer\n\n## Problema observado\n\nO hotfix v0.11.4.1 tornou imagens HTTP(S) elegíveis para o Request Bundle mesmo quando CORS impede o navegador de ler seus bytes, usando `source.mode=remote-url`. Um teste real com um agente externo mostrou a fronteira seguinte: o agente conseguia localizar e visualizar a imagem pela web, mas seu editor de imagens não conseguia consumir essa visualização como pixel source. O contrato de fidelidade corretamente impediu recriar o produto por aproximação.\n\n## Decisão\n\nO Request Bundle v2 mantém `remote-url`, mas passa a incluir `tools/materialize-sources.py` e instruções explícitas no `README.txt`. O helper usa somente a biblioteca padrão do Python e transforma locators remotos em arquivos locais antes da edição.\n\nO helper:\n\n- lê `manifest.json` e nunca o modifica;\n- valida o fingerprint `sha256(\"remote-url:<url>\")`;\n- aceita somente HTTP(S), sem credenciais e em portas 80/443;\n- bloqueia localhost, endereços privados/link-local/não globais e limita redirects;\n- limita bytes por fonte e no conjunto;\n- identifica PNG/JPEG/WebP/GIF/AVIF por assinatura e SVG somente quando declarado como SVG;\n- deduplica por fingerprint;\n- grava `sources/materialized/<fingerprint>.<ext>`;\n- grava `context/materialized-sources.json` com hash dos bytes, MIME, URL final e jobs associados;\n- retorna código não-zero se alguma fonte falhar.\n\n`context/materialized-sources.json` é evidência auxiliar, não uma nova autoridade. `manifest.json`, `requestId`, `jobId`, `placementKey` e `usageSignature` permanecem inalterados.\n\n## Paved path do consumidor\n\nApós extrair o Request Bundle:\n\n```bash\npython3 tools/materialize-sources.py .\n```\n\nPara `embedded`, o arquivo em `source.path` já é a fonte. Para `remote-url`, o consumidor usa o caminho correspondente no índice materializado. Uma imagem vista em browser/web search não deve ser usada como justificativa para recriação aproximada.\n\nTransformações que podem ser executadas fielmente por ferramentas file-native devem preferir os arquivos locais. Um editor generativo só pode ser usado quando consegue ingerir os pixels reais. Se o ambiente não conseguir materializar bytes ou aplicar a transformação necessária sobre o arquivo, o job deve ser reportado como `capability-blocked`, não aproximado.\n\n## Compatibilidade\n\n- Request manifest continua em versão 2;\n- Result Bundle continua em versão 1;\n- schema do CatalogoTop continua 7;\n- `requestId` não passa a depender do README/helper;\n- nenhum endpoint/backend novo é adicionado;\n- nenhum proxy genérico de imagens é introduzido.\n''', encoding='utf-8')
          PY
          node scripts/variation-bundle-request-fixture.mjs
          node scripts/variation-bundle-static-fixture.mjs
          git config user.name 'CatalogoTop Automation'
          git config user.email 'catalogotop-automation@users.noreply.github.com'
          git rm .github/workflows/apply-v0.11.4.2-source-materializer.yml
          git add src/variation-bundle.js scripts/variation-bundle-request-fixture.mjs scripts/variation-bundle-static-fixture.mjs docs/image-variants-v0.11.4.md docs/v0.11.4.2-source-materializer.md AGENTS.md
          git commit -m 'fix: add remote source materializer to variation requests'
          git push origin HEAD:"$branch"
