name: CatalogoTop Browser Print Gate

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:

jobs:
  browser-print:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser gate dependencies
        run: npm install --no-save playwright@1.55.0 pdf-lib@1.17.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run physical PDF regression gates
        run: node scripts/browser-bootstrap-gate.mjs && node scripts/browser-product-snapshot-gate.mjs && node scripts/browser-product-domain-gate.mjs && node scripts/browser-print-gate.mjs && node scripts/browser-collection-gate.mjs && node scripts/browser-table-gate.mjs && node scripts/browser-inspector-gate.mjs && node scripts/browser-grouping-ux-gate.mjs && node scripts/browser-composer-order-legibility-gate.mjs && node scripts/browser-desktop-authoring-workspace-gate.mjs && node scripts/browser-control-density-gate.mjs && node scripts/browser-editor-shortcuts-history-gate.mjs && node scripts/browser-mobile-polish-gate.mjs && node scripts/browser-product-category-gate.mjs && node scripts/browser-product-library-gate.mjs && node scripts/browser-saved-catalogs-gate.mjs && node scripts/browser-catalog-library-gate.mjs && node scripts/browser-asset-library-gate.mjs && node scripts/browser-asset-library-admin-gate.mjs && node scripts/browser-money-gate.mjs && node scripts/browser-commercial-presentation-gate.mjs && node scripts/browser-quantity-pricing-gate.mjs && node scripts/browser-image-framing-gate.mjs && node scripts/browser-image-variants-gate.mjs && node scripts/browser-v1-retirement-gate.mjs && node scripts/browser-render-fidelity-scroll-gate.mjs && node scripts/browser-date-gate.mjs && node scripts/browser-r4a-template-gate.mjs && node scripts/browser-r4b-template-library-gate.mjs
